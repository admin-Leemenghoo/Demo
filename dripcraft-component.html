<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DripCraft — Generated Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body > *:first-child { min-height: 100vh; }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ms-login-container">
  <!-- Background Overlay for Comic Texture -->
  <div class="ms-bg-texture"></div>

  <!-- Navigation Bar -->
  <nav class="ms-navbar">
    <div class="ms-nav-brand">
      <!-- Modified Logo Section: Marvel Studios LED Style -->
      <div class="ms-nav-marvel-logo">
        <div class="ms-led-wrapper">
          <span class="ms-marvel-box">MARVEL</span>
          <span class="ms-studios-text">STUDIOS</span>
        </div>
      </div>
    </div>

    <div class="ms-nav-menu" id="ms-nav-menu">
      <a href="#" class="ms-nav-link active">DASHBOARD</a>
      <a href="#" class="ms-nav-link">MISSIONS</a>
      <a href="#" class="ms-nav-link">INTEL</a>
      <a href="#" class="ms-nav-link">ARCHIVES</a>
    </div>

    <div class="ms-nav-actions">
      <div class="ms-status-indicator">
        <span class="ms-dot"></span>
        <span class="ms-status-label">ENCRYPTED</span>
      </div>
      <button class="ms-nav-toggle" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <div class="ms-login-card-anchor">
    <div class="ms-login-card" aria-labelledby="ms-login-title" role="region">
      <div class="ms-login-content">
        <div class="ms-login-header">
          <div class="ms-marvel-logo-main">
            <span class="ms-marvel-red">MARVEL</span>
            <span class="ms-marvel-studios">STUDIOS</span>
          </div>
          <h2 id="ms-login-title">S.H.I.E.L.D. DATABASE ACCESS</h2>
        </div>

        <form class="ms-login-form" onsubmit="return false;">
          <div class="ms-input-group">
            <label for="ms-agent-id">AGENT IDENTITY</label>
            <input type="text" id="ms-agent-id" placeholder="Agent Romanoff" required
              aria-required="true">
          </div>

          <div class="ms-input-group">
            <label for="ms-pass-code">ACCESS CODE</label>
            <input type="password" id="ms-pass-code" placeholder="••••••••" required
              aria-required="true">
          </div>

          <button type="submit" class="ms-login-submit">
            <span class="ms-btn-text">AUTHENTICATE</span>
            <div class="ms-btn-glitch"></div>
          </button>

          <!-- Fixed Form Footer: Scoped specifically to prevent CSS leak from Logo styles -->
          <div class="ms-form-footer">
            <a href="#" class="ms-link">Request Clearance</a>
            <span class="ms-divider">|</span>
            <a href="#" class="ms-link">Secure Terminal</a>
          </div>
        </form>
      </div>

      <div class="ms-card-overlay"></div>
      <div class="ms-card-scanline"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
